[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "excel-skill"
version = "0.1.0"
description = "AI agent skill for generating industry-specific Excel templates and automating Excel workflows. Covers finance / FMCG / e-commerce / internet / SaaS scenarios."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Excel Skill Contributors" }]
keywords = [
    "excel", "xlsx", "openpyxl", "pandas",
    "finance", "fmcg", "ecommerce", "internet",
    "skill", "claude-code", "cursor", "agent",
    "dashboard", "pivot-table", "power-query",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
]
dependencies = [
    "openpyxl>=3.1.2",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "rich>=13.7.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/gaaiyun/excel-skill"
Issues = "https://github.com/gaaiyun/excel-skill/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]
