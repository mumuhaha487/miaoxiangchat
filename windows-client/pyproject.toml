[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "miaoxiang-computer-agent"
version = "0.6.2"
description = "妙想之地 Windows 桌面工作区、Computer Use 与 ADB 客户端"
requires-python = ">=3.11,<3.14"
license = {text = "Proprietary; includes MIT-licensed Enikk-derived portions"}
dependencies = [
  "httpx==0.28.1",
  "websockets==15.0.1",
  "mss==10.1.0",
  "Pillow==12.3.0",
  "numpy==2.2.6",
  "opencv-python==4.12.0.88",
  "rapidocr-onnxruntime==1.4.4",
  "onnxruntime==1.22.1",
  "pywin32==311; sys_platform == 'win32'",
  "pyautogui==0.9.54; sys_platform == 'win32'",
  "pywinauto==0.6.9; sys_platform == 'win32'",
  "pynput==1.8.1; sys_platform == 'win32'",
  "pystray==0.19.5; sys_platform == 'win32'",
  "psutil==7.1.0; sys_platform == 'win32'",
  "defusedxml==0.7.1",
  "pywebview==6.2.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "backports.tarfile==1.2.0",
  "pytest==9.0.3",
  "pytest-asyncio==1.4.0",
  "ruff==0.13.2",
  "pyinstaller==6.16.0; sys_platform == 'win32'",
]

[project.scripts]
miaoxiang-computer-agent = "vmss_agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 120
