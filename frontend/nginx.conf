map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name _;
  client_max_body_size 21m;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Cross-Origin-Opener-Policy same-origin always;
  add_header Cross-Origin-Resource-Policy same-origin always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://res.wx.qq.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:" always;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }

  location /downloads/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /admin {
    default_type text/plain;
    charset utf-8;
    return 200 "管理员后台不在这里，不要再爬取了。\n";
  }

  location = /admin/ {
    default_type text/plain;
    charset utf-8;
    return 200 "管理员后台不在这里，不要再爬取了。\n";
  }

  location = /mmhh {
    try_files /index.html =404;
  }

  location = /mmhh/ {
    try_files /index.html =404;
  }

  location = /project-admin-admin {
    default_type text/plain;
    charset utf-8;
    return 404 "页面不存在。\n";
  }

  location = /project-admin-admin/ {
    default_type text/plain;
    charset utf-8;
    return 404 "页面不存在。\n";
  }

  location ~ "^/[A-Za-z0-9][A-Za-z0-9._-]{2,31}/[0-9]{1,5}(?:/.*)?$" {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 3600s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
